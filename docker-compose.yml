# Local automation stack for LendLoop: n8n + Mailpit (email sink).
#
#   sh scripts/setup-n8n-env.sh      # once: creates n8n/.env with random secrets
#   docker compose up -d             # n8n-init imports + publishes the workflows, then n8n starts
#
#   n8n editor   http://localhost:5678
#   Mailpit UI   http://localhost:8025
#
# Every port is bound to 127.0.0.1 on purpose: the n8n editor can read $env
# (the HMAC secrets) and Mailpit shows every recipient address, so neither may
# be reachable from the LAN. Nothing needs them from outside this machine.
#
# Convex and Next.js run on the host (npx convex dev / npm run dev); n8n reaches
# Convex HTTP actions through host.docker.internal (CONVEX_SITE_URL).

name: lendloop

x-n8n-common: &n8n-common
  image: docker.n8n.io/n8nio/n8n:2.46.6
  # Non-secret defaults first, then n8n/.env (gitignored) so its values win.
  env_file:
    - path: n8n/defaults.env
      required: true
    - path: n8n/.env
      required: true
  environment:
    # Code nodes run in n8n's internal JS task runner. They read secrets via
    # $env, which n8n 2.x blocks unless this is "false", and need node:crypto
    # for HMAC, which the runner only allows when allowlisted.
    N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    NODE_FUNCTION_ALLOW_BUILTIN: crypto
    # console.log in Code nodes goes to the container log (one-line summaries, never payloads).
    CODE_ENABLE_STDOUT: "true"
    # "Write back reminder" retries each loan inside one Code node (up to ~200 s
    # when Convex is down), so the task timeout leaves room for that.
    N8N_RUNNERS_TASK_TIMEOUT: "300"
    N8N_WEBHOOK_URL: http://localhost:5678/
    N8N_EDITOR_BASE_URL: http://localhost:5678
    # Plain-http localhost only; behind TLS in production remove this.
    N8N_SECURE_COOKIE: "false"
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    # Executions contain recipient emails, so keep them only as long as the admin
    # Automation page looks back (7 days).
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: "168"
    # Unsigned requests to the public webhook are rejected but still saved as
    # executions. Cap their size (MiB; real request events are under 1 KB)
    # and the number kept, so junk traffic can't fill the volume.
    N8N_PAYLOAD_SIZE_MAX: "1"
    EXECUTIONS_DATA_PRUNE_MAX_COUNT: "2000"
  volumes:
    - n8n_data:/home/node/.n8n
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:8025:8025" # web UI
      - "127.0.0.1:1025:1025" # SMTP
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-shot: imports credentials + workflows and publishes them (idempotent).
  n8n-init:
    <<: *n8n-common
    restart: "no"
    entrypoint: ["/bin/sh", "/init/import.sh"]
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/init:/init:ro
      - ./n8n/workflows:/import/workflows:ro
      - ./n8n/credentials:/import/credentials:ro

  n8n:
    <<: *n8n-common
    restart: unless-stopped
    depends_on:
      n8n-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  n8n_data:
